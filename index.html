<body>

    <div class="container">
        <!-- Judul Website -->
        <div class="header">
            <span class="brand-badge">Instant QR Generator</span>
            <h1>konverterQR Khresmupu</h1>
            <p class="subtitle">Ubah teks atau link menjadi QR Code cantik serba pink!</p>
        </div>

        <!-- Form Input Teks & Tombol Paste -->
        <div class="form-group">
            <label for="input-text">Masukkan Link / Teks:</label>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="input-text" 
                    placeholder="Ketik atau tempel link..."
                    oninput="generateQR()"
                >
                <button type="button" class="btn-paste" onclick="pasteText()">📋 Paste</button>
            </div>
        </div>

        <!-- Wadah Output QR & Link Judul -->
        <div class="qr-area">
            <img id="qr-img" src="" alt="QR Code Output">
            <div id="qr-preview" class="qr-url-preview"></div>
        </div>

        <!-- Tombol Unduh PDF / Cetak -->
        <button class="btn-pdf" onclick="window.print()">📄 Unduh / Simpan PDF</button>
    </div>

    <script>
        // 1. Fungsi Mengenerate QR Code
        function generateQR() {
            const inputVal = document.getElementById('input-text').value.trim();
            const qrImg = document.getElementById('qr-img');
            const qrPreview = document.getElementById('qr-preview');

            if (inputVal === "") {
                qrImg.style.display = "none";
                qrPreview.innerText = "Masukkan teks atau URL di atas";
            } else {
                const apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(inputVal);
                
                qrImg.src = apiUrl;
                qrImg.style.display = "block";
                qrPreview.innerText = inputVal;
            }
        }

        // 2. Fitur Tombol Paste
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('input-text').value = text;
                generateQR();
            } catch (err) {
                alert('Gagal membaca clipboard. Izinkan akses clipboard di browser Anda.');
            }
        }

        // 3. Fitur Menerima Input dari Website Lain via Parameter URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const externalData = urlParams.get('data') || urlParams.get('text') || urlParams.get('link');

            if (externalData) {
                document.getElementById('input-text').value = externalData;
            }
            
            generateQR();
        });
    </script>

</body>
