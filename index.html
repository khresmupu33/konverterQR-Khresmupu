<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ================= METADATA SEO UTAMA ================= -->
    <title>konverterQR Khresmupu - Generator & Konverter QR Code Instant</title>
    <meta name="description" content="konverterQR Khresmupu adalah aplikasi pembuat & pemindai QR Code instant serba pink secara gratis untuk konversi link, teks, scan kamera/file, dan cetak PDF/PNG.">
    <meta name="keywords" content="konverterQR Khresmupu, generator QR code, konverter QR, scan QR code, buat QR code pink, QR code instant, buat QR code bisnis">
    <meta name="author" content="Khresmupu">
    <meta name="robots" content="index, follow">

    <!-- ================= FAVICON & GOOGLE SEARCH ICON ================= -->
    <link rel="icon" type="image/png" href="KasKeuanganKhresmupu.png">
    <link rel="apple-touch-icon" href="KasKeuanganKhresmupu.png">

    <!-- ================= OPEN GRAPH / SOCIAL MEDIA ================= -->
    <meta property="og:title" content="konverterQR Khresmupu - Generator & Pemindai QR Code Instant">
    <meta property="og:description" content="Ubah teks/link jadi QR Code cantik serba pink, unduh PNG/PDF, atau scan QR via kamera dan unggah file!">
    <meta property="og:image" content="https://kaskeuangan.wuaze.com/KasKeuanganKhresmupu.png">
    <meta property="og:url" content="https://konverterqr-Khresmupu.netlify.app/">
    <meta property="og:type" content="website">

    <!-- ================= GOOGLE FONTS ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- External Libraries: html5-qrcode, html2canvas, Cropper.js -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fce4ec; /* Soft Pink Background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
            border: 2px solid #f8bbd0;
            text-align: center;
        }

        /* Area Card yang akan di-render saat Unduh PNG / PDF */
        #qr-card-render {
            background: #ffffff;
            padding: 15px;
            border-radius: 16px;
        }

        .header {
            margin-bottom: 20px;
        }

        .brand-badge {
            background-color: #f8bbd0;
            color: #c2185b;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            color: #d81b60; /* Deep Pink */
            font-size: 22px;
            font-weight: 700;
        }

        p.subtitle {
            color: #880e4f;
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 0;
            font-weight: 400;
        }

        /* Navigation Tab (Buat vs Scan) */
        .tab-container {
            display: flex;
            background-color: #f8bbd0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: #880e4f;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: #d81b60;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #ad1457;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Input Container dengan Tombol Action */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 145px 12px 14px;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
            color: #4a148c;
            background-color: #fff8fa;
        }

        input[type="text"]:focus {
            border-color: #e91e63;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
        }

        .input-actions {
            position: absolute;
            right: 6px;
            display: flex;
            gap: 4px;
        }

        .btn-action {
            background-color: #ec407a;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #d81b60;
        }

        .btn-reset {
            background-color: #ad1457;
        }

        .btn-reset:hover {
            background-color: #880e4f;
        }

        /* Area Tampilan QR */
        .qr-area {
            background-color: #fff0f5;
            border: 2px dashed #f48fb1;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .qr-area img {
            max-width: 200px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.15);
            border: 4px solid #ffffff;
        }

        .qr-url-preview {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #c2185b;
            word-break: break-all;
            max-width: 100%;
        }

        /* Grid Action Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-png {
            background-color: #ec407a;
            color: white;
        }

        .btn-png:hover {
            background-color: #d81b60;
            transform: translateY(-1px);
        }

        .btn-pdf {
            background-color: #c2185b;
            color: white;
        }

        .btn-pdf:hover {
            background-color: #880e4f;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #f48fb1;
            color: #880e4f;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #f06292;
            color: white;
        }

        /* Style Scanner QR & Crop Box */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #f8bbd0;
            background: #fff0f5;
        }

        #reader video {
            border-radius: 12px;
        }

        .file-input-wrapper {
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: block;
            padding: 12px;
            background-color: #fff0f5;
            color: #c2185b;
            border: 2px dashed #f48fb1;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .file-label:hover {
            background-color: #f8bbd0;
        }

        /* Area Cropper */
        .crop-container {
            display: none;
            margin-top: 15px;
            background: #fff0f5;
            padding: 10px;
            border-radius: 12px;
            border: 2px dashed #f48fb1;
        }

        .crop-img-wrapper {
            max-height: 300px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .crop-img-wrapper img {
            max-width: 100%;
            display: block;
        }

        .scan-result-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #fff0f5;
            border: 1px solid #f8bbd0;
            border-radius: 12px;
            text-align: left;
            word-break: break-all;
            display: none;
        }

        .scan-result-box h4 {
            margin: 0 0 6px 0;
            color: #ad1457;
            font-size: 12px;
            text-transform: uppercase;
        }

        .scan-result-box p {
            margin: 0;
            font-size: 13px;
            color: #4a148c;
            font-weight: 500;
        }

        /* CETAK PDF */
        @media print {
            body { 
                background: none; 
                padding: 0;
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .brand-badge,
            .subtitle,
            .tab-container,
            .form-group,
            .button-group,
            .input-actions,
            #tab-scan { 
                display: none !important; 
            }

            .container { 
                box-shadow: none; 
                border: 2px solid #d81b60; 
                padding: 40px;
                width: 100%;
                max-width: 360px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .qr-area {
                background: none;
                border: none;
                padding: 0;
                margin-bottom: 0;
            }

            .qr-area img {
                box-shadow: none;
                border: 2px solid #f8bbd0;
                width: 260px;
                max-width: 100%;
            }

            .qr-url-preview {
                font-size: 14px;
                color: #000000;
                margin-top: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tab Navigasi -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('generate')">✨ Buat QR</button>
            <button class="tab-btn" onclick="switchTab('scan')">🔍 Scan QR</button>
        </div>

        <!-- TAB 1: GENERATE QR -->
        <div id="tab-generate" class="tab-content active">
            <!-- Form Input -->
            <div class="form-group">
                <label for="input-text">Masukkan Link / Teks:</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="input-text" 
                        placeholder="Ketik atau tempel link..."
                        oninput="generateQR()"
                    >
                    <div class="input-actions">
                        <button type="button" class="btn-action" onclick="pasteText()">📋 Paste</button>
                        <button type="button" class="btn-action btn-reset" onclick="resetForm()">🔄 Reset</button>
                    </div>
                </div>
            </div>

            <!-- Elemen Kartu QR yang akan dirender ke Gambar PNG & PDF -->
            <div id="qr-card-render">
                <div class="header">
                    <span class="brand-badge">Instant QR Tools</span>
                    <h1>konverterQR Khresmupu</h1>
                    <p class="subtitle">Buat, unduh, dan scan QR Code serba pink!</p>
                </div>

                <div class="qr-area">
                    <img id="qr-img" src="" crossorigin="anonymous" alt="QR Code Output">
                    <div id="qr-preview" class="qr-url-preview"></div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-png" onclick="downloadPNGCard()">🖼️ Unduh PNG</button>
                <button class="btn btn-pdf" onclick="window.print()">📄 Unduh PDF</button>
            </div>
        </div>

        <!-- TAB 2: SCAN QR -->
        <div id="tab-scan" class="tab-content">
            <div class="file-input-wrapper">
                <label for="qr-file-input" class="file-label">📁 Upload Gambar QR Code</label>
                <input type="file" id="qr-file-input" accept="image/*" onchange="initCropImage(event)">
            </div>

            <!-- Box Crop Gambar -->
            <div id="crop-container" class="crop-container">
                <div class="crop-img-wrapper">
                    <img id="image-to-crop" src="" alt="Gambar untuk Crop">
                </div>
                <button class="btn btn-png" onclick="processCroppedImage()">✂️ Crop & Scan QR</button>
            </div>

            <button id="btn-camera" class="btn btn-secondary" onclick="toggleCamera()">📷 Buka Kamera Scan</button>
            
            <div id="reader" style="margin-top: 15px; display: none;"></div>

            <div id="scan-result" class="scan-result-box">
                <h4>Hasil Scan:</h4>
                <p id="scan-result-text"></p>
                <button class="btn-action" style="margin-top: 8px; width: 100%;" onclick="copyScanResult()">📋 Salin Hasil</button>
            </div>
        </div>
    </div>

    <script>
        let currentQRUrl = "";
        let html5QrCode = null;
        let isCameraActive = false;
        let cropper = null;

        // 1. Fungsi Navigasi Tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'generate') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-generate').classList.add('active');
                stopCamera();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-scan').classList.add('active');
            }
        }

        // 2. Generator QR Code
        function generateQR() {
            const inputVal = document.getElementById('input-text').value.trim();
            const qrImg = document.getElementById('qr-img');
            const qrPreview = document.getElementById('qr-preview');

            if (inputVal === "") {
                qrImg.style.display = "none";
                qrPreview.innerText = "Masukkan teks atau URL di atas";
                currentQRUrl = "";
            } else {
                currentQRUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(inputVal);
                qrImg.src = currentQRUrl;
                qrImg.style.display = "block";
                qrPreview.innerText = inputVal;
            }
        }

        // 3. Paste Teks
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('input-text').value = text;
                generateQR();
            } catch (err) {
                alert('Gagal membaca clipboard. Izinkan akses clipboard di browser Anda.');
            }
        }

        // 4. Reset Form Input & QR
        function resetForm() {
            document.getElementById('input-text').value = "";
            generateQR();
        }

        // 5. Unduh Seluruh Kartu QR Tampilan PDF Sebagai Gambar PNG
        function downloadPNGCard() {
            const inputVal = document.getElementById('input-text').value.trim();
            if (!inputVal) {
                alert("Silakan masukkan teks atau link terlebih dahulu!");
                return;
            }

            const cardElement = document.getElementById('qr-card-render');

            html2canvas(cardElement, {
                useCORS: true,
                scale: 2,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.href = image;
                link.download = 'Kartu_QR_Khresmupu.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                alert("Gagal mengunduh gambar kartu PNG.");
            });
        }

        // 6. Crop & Scan QR dari Upload File
        function initCropImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const cropImg = document.getElementById('image-to-crop');
                cropImg.src = e.target.result;
                document.getElementById('crop-container').style.display = 'block';

                if (cropper) {
                    cropper.destroy();
                }

                cropper = new Cropper(cropImg, {
                    viewMode: 1,
                    autoCropArea: 0.8,
                    responsive: true
                });
            };
            reader.readAsDataURL(file);
        }

        function processCroppedImage() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas();
            canvas.toBlob((blob) => {
                const croppedFile = new File([blob], "cropped_qr.png", { type: "image/png" });

                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }

                html5QrCode.scanFile(croppedFile, true)
                    .then(qrCodeMessage => {
                        displayScanResult(qrCodeMessage);
                        document.getElementById('crop-container').style.display = 'none';
                    })
                    .catch(err => {
                        alert("QR Code tidak dapat dibaca dari area pemotongan ini. Coba sesuaikan crop gambar.");
                    });
            });
        }

        // 7. Scan QR Menggunakan Kamera
        function toggleCamera() {
            const readerDiv = document.getElementById('reader');
            const btnCam = document.getElementById('btn-camera');

            if (isCameraActive) {
                stopCamera();
            } else {
                document.getElementById('crop-container').style.display = 'none';
                readerDiv.style.display = "block";
                btnCam.innerText = "🛑 Tutup Kamera";
                isCameraActive = true;

                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }

                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {
                        displayScanResult(decodedText);
                        stopCamera();
                    },
                    (errorMessage) => {
                        // Mengabaikan error per frame
                    }
                ).catch(err => {
                    alert("Gagal membuka kamera. Pastikan izin kamera sudah diberikan.");
                    stopCamera();
                });
            }
        }

        function stopCamera() {
            if (html5QrCode && isCameraActive) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = "none";
                    document.getElementById('btn-camera').innerText = "📷 Buka Kamera Scan";
                    isCameraActive = false;
                }).catch(err => console.error(err));
            }
        }

        // 8. Menampilkan & Salin Hasil Scan
        function displayScanResult(text) {
            const resultBox = document.getElementById('scan-result');
            const resultText = document.getElementById('scan-result-text');
            
            resultText.innerText = text;
            resultBox.style.display = "block";
        }

        function copyScanResult() {
            const text = document.getElementById('scan-result-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Hasil scan berhasil disalin ke clipboard!");
            });
        }

        // 9. Integrasi Parameter URL saat Load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const externalData = urlParams.get('data') || urlParams.get('text') || urlParams.get('link');

            if (externalData) {
                document.getElementById('input-text').value = externalData;
            }

            generateQR();
        });
    </script>
</body>
</html>
